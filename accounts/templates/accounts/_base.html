{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Boben{% endblock %}</title>
  <meta name="theme-color" content="#eaf1ed">
  <script>
    try {
      var p = JSON.parse(localStorage.getItem("boben-prefs-v1") || "{}");
      var dark = p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.setAttribute("data-size", p.size || "medium");
      document.documentElement.dataset.fun = p.fun === "off" ? "off" : "on";
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="{% static 'assistant/icons/favicon-64.png' %}">
  <link rel="apple-touch-icon" href="{% static 'assistant/icons/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'assistant/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assistant/css/auth.css' %}">
</head>
<body class="auth-body">
  <div class="backdrop" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
  <div class="emoji-bg" id="emojiBg" aria-hidden="true"></div>

  <main class="auth-wrap">
    <section class="auth-card glass {% block card_class %}{% endblock %}">
      {% block back %}
      <a class="back-btn" href="{% block back_url %}{% url 'index' %}{% endblock %}">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>{% block back_label %}Back{% endblock %}</span>
      </a>
      {% endblock %}

      {% block content %}{% endblock %}

      <p class="auth-credit">Developed by Jhon Grover Longsud</p>
    </section>
  </main>

  <script src="{% static 'assistant/js/emoji-bg.js' %}"></script>
  <script src="{% static 'assistant/js/auth.js' %}"></script>
</body>
</html>
